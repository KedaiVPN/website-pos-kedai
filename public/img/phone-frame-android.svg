<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 580" width="280" height="580">
  <defs>
    <!-- Phone body gradient - metallic dark gray/slate -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3c"/>
      <stop offset="50%" style="stop-color:#2c2c2e"/>
      <stop offset="100%" style="stop-color:#1c1c1e"/>
    </linearGradient>
    <!-- Screen glass reflection -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.08)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Phone outer body -->
  <rect x="4" y="4" width="272" height="572" rx="36" ry="36" fill="url(#bodyGrad)" filter="url(#phoneShadow)"/>
  
  <!-- Phone inner bezel (slightly lighter) -->
  <rect x="6" y="6" width="268" height="568" rx="34" ry="34" fill="#1c1c1e" stroke="#48484a" stroke-width="0.5"/>
  
  <!-- Screen area (where screenshot goes) -->
  <rect x="12" y="12" width="256" height="556" rx="30" ry="30" fill="#ffffff"/>
  
  <!-- Screen glass overlay -->
  <rect x="12" y="12" width="256" height="556" rx="30" ry="30" fill="url(#glassGrad)" pointer-events="none"/>
  
  <!-- PUNCH-HOLE FRONT CAMERA (the key feature!) -->
  <circle cx="140" cy="32" r="5" fill="#1a1a1e"/>
  <circle cx="140" cy="32" r="3.5" fill="#0d0d0f"/>
  <!-- Camera lens inner ring -->
  <circle cx="139" cy="31" r="1.5" fill="rgba(100,120,180,0.3)"/>
  
  <!-- Side buttons - volume -->
  <rect x="0" y="160" width="3" height="36" rx="1.5" fill="#48484a"/>
  <rect x="0" y="204" width="3" height="36" rx="1.5" fill="#48484a"/>
  <!-- Side button - power -->
  <rect x="277" y="180" width="3" height="48" rx="1.5" fill="#48484a"/>
</svg>