<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 540" width="260" height="540">
  <rect width="260" height="540" fill="#F8F9FA"/>
  
  <!-- Status Bar -->
  <text x="16" y="21" font-family="sans-serif" font-size="12" fill="#333">Kam 10:15</text>
  <text x="195" y="21" font-family="sans-serif" font-size="10" fill="#333">📶  🔋 92%</text>
  
  <!-- Header -->
  <rect x="0" y="32" width="260" height="52" fill="#FFFFFF"/>
  <text x="130" y="62" font-family="sans-serif" font-size="15" fill="#1A1A1A" font-weight="600" text-anchor="middle">Manajemen Stok</text>
  
  <!-- Alert Banner -->
  <rect x="12" y="94" width="236" height="36" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="24" y="117" font-family="sans-serif" font-size="11" fill="#92400E" font-weight="500">⚠️ 3 produk stok menipis!</text>
  
  <!-- Search -->
  <rect x="12" y="140" width="236" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="28" y="162" font-family="sans-serif" font-size="12" fill="#9CA3AF">🔍 Cari stok barang...</text>
  
  <!-- Stock Items -->
  <rect x="12" y="186" width="236" height="56" rx="10" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="24" y="210" font-family="sans-serif" font-size="12" fill="#1A1A1A" font-weight="500">Gula Pasir 1kg</text>
  <text x="24" y="228" font-family="sans-serif" font-size="10" fill="#DC2626" font-weight="600">Sisa 2 pcs — Segera restok!</text>
  <rect x="180" y="200" width="58" height="24" rx="12" fill="#DC2626"/>
  <text x="209" y="216" font-family="sans-serif" font-size="10" fill="#FFF" text-anchor="middle" font-weight="500">Restok</text>
  
  <rect x="12" y="250" width="236" height="56" rx="10" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="24" y="274" font-family="sans-serif" font-size="12" fill="#1A1A1A" font-weight="500">Rokok Sampoerna Mild</text>
  <text x="24" y="292" font-family="sans-serif" font-size="10" fill="#DC2626" font-weight="600">Sisa 5 bks — Hampir habis</text>
  <rect x="180" y="264" width="58" height="24" rx="12" fill="#F59E0B"/>
  <text x="209" y="280" font-family="sans-serif" font-size="10" fill="#FFF" text-anchor="middle" font-weight="500">Restok</text>
  
  <rect x="12" y="314" width="236" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="24" y="338" font-family="sans-serif" font-size="12" fill="#1A1A1A" font-weight="500">Minyak Goreng 2L</text>
  <text x="24" y="356" font-family="sans-serif" font-size="10" fill="#16A34A">Stok: 48 pcs — Aman</text>
  
  <rect x="12" y="378" width="236" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="24" y="402" font-family="sans-serif" font-size="12" fill="#1A1A1A" font-weight="500">Beras Pandan 5kg</text>
  <text x="24" y="420" font-family="sans-serif" font-size="10" fill="#16A34A">Stok: 31 karung — Aman</text>
  
  <rect x="12" y="442" width="236" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="24" y="466" font-family="sans-serif" font-size="12" fill="#1A1A1A" font-weight="500">Telur Ayam</text>
  <text x="24" y="484" font-family="sans-serif" font-size="10" fill="#16A34A">Stok: 25 rak — Aman</text>
  
  <!-- Bottom Nav -->
  <rect x="0" y="506" width="260" height="34" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="52" y="528" font-family="sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">🏠 Beranda</text>
  <text x="130" y="528" font-family="sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">🛒 Kasir</text>
  <text x="208" y="528" font-family="sans-serif" font-size="9" fill="#16A34A" text-anchor="middle" font-weight="600">📊 Stok</text>
